databases:
  - name: ferme-db
    plan: free
    databaseName: ferme
    user: ferme

services:
  - type: web
    name: ferme-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ferme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://CHANGE-ME.vercel.app
